name: Build Linux Application

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Package (.deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux Package
        run: pnpm tauri build --bundles deb

      - name: Locate Built Package
        id: locate-deb
        run: |
          DEB_PATH=$(find src-tauri/target/release/bundle/deb target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -z "$DEB_PATH" ]; then
            echo "Error: DEB file not found"
            exit 1
          fi
          echo "Found DEB: $DEB_PATH"
          echo "deb_path=$DEB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moustache-linux-deb
          path: ${{ steps.locate-deb.outputs.deb_path }}
          if-no-files-found: error

      - name: Publish to GitHub Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate-deb.outputs.deb_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
