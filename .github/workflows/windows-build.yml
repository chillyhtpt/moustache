name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = 'C:\st'
          $env:GGML_NATIVE = 'OFF'
          $env:GGML_AVX = 'ON'
          $env:GGML_AVX2 = 'ON'
          $env:GGML_BMI2 = 'ON'
          $env:GGML_FMA = 'ON'
          $env:GGML_F16C = 'ON'
          pnpm tauri build --bundles nsis

      - name: Locate Built Installer
        id: locate-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "C:\st\release\bundle\nsis\*.exe", "src-tauri/target/release/bundle/nsis/*.exe", "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Could not find built NSIS installer (.exe)"
            exit 1
          }
          Write-Host "Found installer: $($installer.FullName)"
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shrimp-windows-installer
          path: ${{ steps.locate-installer.outputs.installer_path }}
          if-no-files-found: error

      - name: Publish to GitHub Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate-installer.outputs.installer_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
